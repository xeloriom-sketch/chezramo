<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chez Ramo — Admin</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <!-- ═══ TOAST CONTAINER ════════════════════════════════════ -->
  <div id="toast-container"></div>

  <!-- ═══ LOGIN ══════════════════════════════════════════════ -->
  <div id="login-screen">
    <div class="login-logo">CHEZ <span>RAMO</span></div>
    <div class="login-subtitle">Panneau d'administration</div>
    <div class="login-box">
      <div class="login-field">
        <label class="login-label">Mot de passe</label>
        <input id="login-pw" class="login-input" type="password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="login-btn" onclick="doLogin()">Se connecter</button>
    </div>
    <div class="login-hint">Appuyez sur Entrée pour valider</div>
  </div>

  <!-- ═══ APP (masqué jusqu'à connexion) ═════════════════════ -->
  <div id="app" style="display:none">

    <!-- ── TOPBAR ─────────────────────────────────────────── -->
    <header class="topbar">

      <!-- Ligne principale (toujours visible) -->
      <div class="topbar-row1">
        <button class="menu-toggle" onclick="toggleSidebar()" title="Menu catégories" aria-label="Ouvrir les catégories">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6"  x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <div class="topbar-brand">CHEZ <span>RAMO</span> <span class="topbar-sub">Admin</span></div>

        <!-- Recherche desktop — visible à partir de 640px -->
        <div class="topbar-search-desktop">
          <div class="search-wrap">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input id="search-input" class="search-input" type="text" placeholder="Rechercher un article…">
          </div>
        </div>

        <div class="topbar-spacer"></div>

        <div id="status-pill" class="status-pill loading">Connexion…</div>
        <button class="btn btn-outline btn-sm" onclick="showTuto()" title="Aide et tutoriel">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
            <line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
          <span class="btn-label">Aide</span>
        </button>
      </div>

      <!-- Ligne 2 — recherche mobile uniquement (masquée à 640px+) -->
      <div class="topbar-row2">
        <div class="search-wrap">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input class="search-input" type="text" placeholder="Rechercher un article…"
            oninput="searchQuery=this.value;applySearch()">
        </div>
      </div>

    </header>

    <!-- ── STATS BAR ──────────────────────────────────────── -->
    <div class="stats-bar">
      <div class="stat-item">
        <div class="stat-val" id="stat-cats">—</div>
        <div class="stat-lbl">Catégories</div>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <div class="stat-val" id="stat-items">—</div>
        <div class="stat-lbl">Articles</div>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <div class="stat-val" id="pending-count-stat">0</div>
        <div class="stat-lbl">Modifications</div>
      </div>
    </div>

    <!-- Fond sombre pour fermer la sidebar sur mobile -->
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

    <!-- ── LAYOUT : SIDEBAR + CONTENT ───────────────────────── -->
    <div class="layout">

      <!-- Sidebar -->
      <nav id="sidebar" class="sidebar">
        <div class="sidebar-title">Catégories</div>
        <div id="sidebar-links"></div>
      </nav>

      <!-- Contenu principal -->
      <main id="content" class="content">
        <div style="padding:3rem;text-align:center;color:#555">Chargement…</div>
      </main>

    </div>

    <!-- ── SAVE BAR (fixée en bas) ────────────────────────── -->
    <div id="save-bar" class="save-bar">
      <span id="pending-count" class="save-count">0 modification en attente</span>
      <div class="save-actions">
        <button class="btn btn-ghost btn-sm" onclick="discardAll()">Annuler</button>
        <button id="btn-save-all" class="btn btn-primary btn-sm" onclick="saveAll()">Sauvegarder</button>
      </div>
    </div>

  </div><!-- /#app -->

  <!-- ═══ MODALE ÉDITION ══════════════════════════════════════ -->
  <div id="edit-modal" class="modal-overlay" style="display:none">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-title">Modifier l'article</div>
        <button class="modal-close" onclick="closeModal('edit-modal')">✕</button>
      </div>
      <div class="modal-body">

        <div class="modal-row">
          <div class="form-group" style="flex:1">
            <label class="form-label">ID <small style="color:#666">(auto si vide)</small></label>
            <input id="modal-id" class="form-input" type="text" placeholder="kebab-geant">
          </div>
          <div class="form-group" style="flex:1">
            <label class="form-label">Catégorie *</label>
            <input id="modal-category" class="form-input" type="text" placeholder="Sandwichs Vedettes">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Nom du plat *</label>
          <input id="modal-title" class="form-input" type="text" placeholder="Kebab Géant">
        </div>

        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea id="modal-desc" class="form-input form-textarea" placeholder="Double portion de viande de veau…" rows="2"></textarea>
        </div>

        <div class="modal-row">
          <div class="form-group" style="flex:1">
            <label class="form-label">Prix seul * <small style="color:#666">(ex: 9,00)</small></label>
            <input id="modal-price" class="form-input" type="text" placeholder="9,00">
          </div>
          <div class="form-group" style="flex:1">
            <label class="form-label">Prix menu <small style="color:#666">(optionnel)</small></label>
            <input id="modal-menuprice" class="form-input" type="text" placeholder="12,00">
          </div>
          <div class="form-group" style="flex:1">
            <label class="form-label">Badge <small style="color:#666">(ex: XXL)</small></label>
            <input id="modal-badge" class="form-input" type="text" placeholder="XXL">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">URL image <small style="color:#666">(uploads/…)</small></label>
          <div class="url-row">
            <input id="modal-url" class="form-input" type="text" placeholder="uploads/Kebab Geant.png">
            <img id="modal-img-preview" class="img-preview" src="" alt="" onerror="this.style.display='none'" onload="this.style.display='block'">
          </div>
        </div>

      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeModal('edit-modal')">Annuler</button>
        <button class="btn btn-primary" onclick="saveModal()">Enregistrer</button>
      </div>
    </div>
  </div>

  <!-- ═══ MODALE CONFIRMATION SUPPRESSION ═════════════════════ -->
  <div id="confirm-dialog" class="modal-overlay" style="display:none">
    <div class="modal-box confirm-box">
      <div class="confirm-icon">🗑️</div>
      <div class="confirm-title">Confirmer la suppression</div>
      <div id="confirm-msg" class="confirm-msg">Supprimer cet article ?</div>
      <div class="confirm-actions">
        <button class="btn btn-ghost" onclick="closeModal('confirm-dialog')">Annuler</button>
        <button class="btn btn-danger" onclick="doDelete()">Supprimer</button>
      </div>
    </div>
  </div>

  <!-- ═══ TUTORIAL SPOTLIGHT ══════════════════════════════════ -->
  <div id="tuto-overlay" style="display:none">

    <!-- Zone lumineuse sur l'élément cible -->
    <div id="tuto-spot"></div>

    <!-- Flèche + label "C'EST ICI !" flottant près du spot -->
    <div id="tuto-pointer">
      <span id="tuto-pointer-arrow"></span>
      <span id="tuto-pointer-label">C'EST ICI !</span>
    </div>

    <!-- Carte info (tooltip) -->
    <div id="tuto-card">
      <div id="tuto-dots-row"></div>
      <div id="tuto-emoji"></div>
      <div id="tuto-card-title"></div>
      <div id="tuto-card-text"></div>
      <div id="tuto-nav">
        <button id="tuto-btn-prev" class="tuto-btn-sec" onclick="tutoPrev()">← Retour</button>
        <button id="tuto-btn-next" class="tuto-btn-pri" onclick="tutoNext()">Suivant →</button>
      </div>
      <button id="tuto-btn-skip" onclick="closeTuto()">Passer le tutoriel ✕</button>
    </div>

  </div>

  <script src="admin.js"></script>
</body>
</html>
