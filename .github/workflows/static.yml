name: Deploy Chez Ramo to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: landing-next/package-lock.json

      - name: Installer les dépendances
        working-directory: landing-next
        run: npm ci

      - name: Exclure les routes API (incompatibles avec output export)
        run: mv landing-next/app/api /tmp/api_routes

      - name: Build Next.js (export statique)
        working-directory: landing-next
        env:
          STATIC_EXPORT: 'true'
          NEXT_PUBLIC_BASE_PATH: '/chezramo'
          NEXT_PUBLIC_SITE_URL: 'https://xeloriom-sketch.github.io'
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_FUNCTIONS_URL: https://hqfewokpvjmxezhnurbm.supabase.co/functions/v1
          NEXT_PUBLIC_SUPABASE_URL: https://hqfewokpvjmxezhnurbm.supabase.co
          NEXT_PUBLIC_SUPABASE_KEY: sb_publishable_NmIfxaQb5ncapzCtzI5uNQ_tHdCwAyc
        run: npm run build

      - name: Générer version.json
        run: |
          echo '{"v":"'"$(date -u +%Y%m%d%H%M%S)"'","t":'"$(date -u +%s)"'}' > landing-next/out/version.json

      - name: Convertir images en WebP (nouvelles uniquement)
        run: |
          sudo apt-get install -y webp 2>/dev/null | tail -1
          find uploads/ -maxdepth 1 \( -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" \) 2>/dev/null | while IFS= read -r f; do
            base="${f%.*}"
            if [ ! -f "${base}.webp" ]; then
              cwebp -q 82 -m 4 "$f" -o "${base}.webp" 2>/dev/null
            fi
          done

      - name: Copier uploads dans le dossier out
        run: |
          if [ -d "uploads" ]; then
            cp -r uploads landing-next/out/uploads
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'landing-next/out'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
