name: Deploy Chez Ramo to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Générer version.json
        run: |
          echo '{"v":"'"$(date -u +%Y%m%d%H%M%S)"'","t":'"$(date -u +%s)"'}' > version.json
          echo "Version générée : $(cat version.json)"

      - name: Convertir images en WebP (nouvelles uniquement)
        run: |
          sudo apt-get install -y webp 2>/dev/null | tail -1
          find uploads/ -maxdepth 1 \( -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" \) | while IFS= read -r f; do
            base="${f%.*}"
            if [ ! -f "${base}.webp" ]; then
              echo "Conversion: $f"
              cwebp -q 82 -m 4 "$f" -o "${base}.webp" 2>/dev/null
            fi
          done
          echo "WebP prêts : $(find uploads/ -name '*.webp' | wc -l) fichiers"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
